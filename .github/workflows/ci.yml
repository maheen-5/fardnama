# FardNama — Continuous Integration (Mid-1)
#
# Runs on every push to develop/main/feature branches, on every pull request
# into develop or main, and on demand from the Actions tab ("Run workflow").
#
# Each job first checks whether its part of the project exists in the repo
# (backend/, frontend/, contracts/). If a part is not committed yet, the job
# prints a notice and passes instead of failing, so the workflow stays usable
# while modules are still being pushed. As soon as the folder is committed,
# its lint and tests run automatically.

name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (flake8 + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Detect backend
        id: detect
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend skipped::backend/requirements.txt not found in this commit."
          fi

      - name: Set up Python 3.12
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Tesseract OCR (needed by the OCR tests)
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8

      - name: Lint (flake8)
        if: steps.detect.outputs.present == 'true'
        run: flake8 backend/ --max-line-length=100 --exclude=.venv,venv,__pycache__

      - name: Run unit tests (pytest)
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python -m pytest tests/ -v --junitxml=../pytest-report.xml

      - name: Upload test report
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Build backend Docker image
        if: steps.detect.outputs.present == 'true' && hashFiles('backend/Dockerfile') != ''
        run: docker build -t fardnama-backend ./backend

  frontend:
    name: Frontend (flutter analyze + flutter test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend skipped::frontend/pubspec.yaml not found in this commit."
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: flutter analyze

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: flutter test

  contracts:
    name: Smart contract (Hardhat) — Final-1
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Detect contracts
        id: detect
        run: |
          if [ -f contracts/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Contracts skipped::EvidenceRegistry is design-only at Mid-1; contracts/ is added in Final-1."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and test
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: |
          npm ci
          npx hardhat test

  deployment:
    name: Deployment config (compose + shell)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create local deployment secrets and env
        run: |
          cp .env.example .env
          mkdir -p deployment/secrets deployment/ipfs
          : > deployment/secrets/fardnama_kek
          : > deployment/secrets/registrar_key
          : > deployment/ipfs/swarm.key
          mkdir -p backend

      - name: Validate docker compose
        run: docker compose -f deployment/docker-compose.yml config --quiet

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck deployment scripts
        run: |
          shellcheck deployment/ipfs/init.sh deployment/scripts/gen-secrets.sh
